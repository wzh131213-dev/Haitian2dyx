<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#06101d"><title>星际工坊 2.0</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#06101d;color:#e9f5ff;font-family:system-ui,-apple-system,sans-serif}button{color:inherit;background:#152b40;border:1px solid #35536d;border-radius:9px;padding:8px;font:inherit;cursor:pointer}.primary{background:#087da5!important}#app{height:100dvh;display:flex;flex-direction:column}.top{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#091727;border-bottom:1px solid #24415a;font-weight:800}.top span{color:#6bdcff}.top button{font-size:11px}main{display:grid;grid-template-columns:155px minmax(0,1fr) 190px;gap:8px;padding:8px;flex:1;min-height:0}.panel{background:#0c1b2c;border:1px solid #24415a;border-radius:12px;overflow:auto;min-height:0}.panel h2{font-size:11px;color:#a7c6df;padding:10px;margin:0;border-bottom:1px solid #203a50}.parts{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:6px}.part{font-size:11px;padding:7px 2px}.part i{font-style:normal;display:block;font-size:20px}.note{font-size:10px;color:#91abc2;line-height:1.5;padding:8px}.center{display:flex;flex-direction:column;gap:7px;min-width:0;min-height:0}.tools{display:flex;gap:5px;flex-wrap:wrap}.tools button{font-size:11px;padding:7px}.stage{position:relative;flex:1;min-height:150px;border:1px solid #24415a;border-radius:12px;overflow:hidden;background:#030914}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;left:9px;top:9px;pointer-events:none;text-shadow:0 2px 5px #000;font-size:12px}.overlay small{display:block;color:#9bb8d1}.tele{position:absolute;right:9px;top:9px;display:grid;text-align:right;font-size:11px;text-shadow:0 2px 5px #000}.tele b{color:#6bdcff;font-size:13px}.tip{position:absolute;bottom:8px;text-align:center;width:100%;font-size:10px;color:#a8c4da;pointer-events:none}.metrics{padding:9px;font-size:11px}.metric{display:flex;justify-content:space-between;gap:4px;margin:8px 0;color:#a4bdd1}.metric b{color:white}.bar{height:5px;background:#253b50;border-radius:9px;overflow:hidden}.bar i{display:block;background:#54d6ca;height:100%;width:100%}.logs{font-size:10px;color:#9fb8cd;line-height:1.6}.mobile{display:none;justify-content:center;gap:6px}.mobile button{touch-action:none;min-width:48px}@media(max-width:760px){main{grid-template-columns:100px minmax(0,1fr);padding:5px;gap:5px}.right{display:none}.top{height:43px;font-size:12px}.parts{grid-template-columns:1fr 1fr;padding:4px;gap:4px}.part{font-size:10px;padding:5px 1px}.part i{font-size:17px}.panel h2{padding:8px}.tools button{font-size:10px;padding:6px}.mobile{display:flex}}@media(max-width:420px){main{grid-template-columns:84px minmax(0,1fr)}.part{font-size:9px}.top button{padding:5px;font-size:10px}}
</style></head><body><div id="app"><header class="top">✦ <span>星际工坊 2.0 / ROCKET FLIGHT</span><div><button id="save">保存</button> <button id="load">读取</button> <button id="reset">重置</button></div></header><main>
<aside class="panel"><h2>火箭部件</h2><div class="parts"><button class="part" data-p="capsule"><i>🔺</i>指令舱</button><button class="part" data-p="tank"><i>▤</i>燃料箱</button><button class="part" data-p="engine"><i>🔥</i>发动机</button><button class="part" data-p="booster"><i>🚀</i>助推器</button><button class="part" data-p="solar"><i>▰</i>太阳能板</button><button class="part" data-p="leg"><i>⌁</i>着陆支架</button></div><div class="note">点击添加部件。建造时拖动火箭部件可调整顺序，选中后点击拆除。建议指令舱在顶部、发动机在底部。</div></aside>
<section class="center"><div class="tools"><button id="build">🛠 建造</button><button id="launch" class="primary">▲ 发射</button><button id="throttle">🔥 点火/熄火</button><button id="stage">分离级段</button><button id="orbit">◎ 轨道视图</button><button id="remove">拆除选中</button></div><div class="stage"><canvas id="cv"></canvas><div class="overlay"><b id="title">火箭装配中心</b><small id="sub">选择部件组装火箭</small></div><div class="tele"><b id="alt">高度 0 km</b><span id="vel">速度 0 m/s</span><span id="fuel">燃料 100%</span></div><div class="tip" id="tip">点击左侧添加部件 · 拖动部件调整顺序</div></div><div class="mobile"><button id="left">◀</button><button id="push" class="primary">推进</button><button id="right">▶</button><button id="cut">熄火</button></div></section>
<aside class="panel right"><h2>飞行遥测</h2><div class="metrics"><div class="metric"><span>任务阶段</span><b id="mission">建造中</b></div><div class="metric"><span>飞行时间</span><b id="clock">T+00:00</b></div><div class="metric"><span>火箭质量</span><b id="mass">0 t</b></div><hr style="border-color:#203a50"><div class="metric"><span>燃料余量</span><b id="fn">100%</b></div><div class="bar"><i id="bar"></i></div><div class="metric"><span>推力/质量比</span><b id="twr">—</b></div><h2 style="padding:10px 0;border:0">任务日志</h2><div class="logs" id="logs">工坊已就绪。</div><div class="note">键盘：← → 转向，↑ 推进，空格点火，X 熄火，Enter 分离级段。</div></div></aside>
</main></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),cv=$('#cv'),c=cv.getContext('2d');let W=700,H=450,dpr=1,mode='build',parts=[],sel=-1,drag=-1,dragY=0,keys={},last=0,logs=[];let f={x:0,y:0,vx:0,vy:0,a:0,fuel:100,t:0,thrust:false,crash:false,orbit:false,stage:0};const D={capsule:['指令舱',1.2,0,'#e7edf2',27],tank:['燃料箱',2,22,'#c6d3df',27],engine:['发动机',1.5,0,'#8e9eae',23],booster:['助推器',2.4,14,'#d8e1e8',27],solar:['太阳能板',.2,0,'#3477b9',15],leg:['着陆支架',.4,0,'#a8b6c3',18]};function mass(){return parts.reduce((s,p)=>s+p.m,0)}function cap(){return parts.reduce((s,p)=>s+p.f,0)}function eng(){return parts.filter(p=>p.type==='engine').length}function boo(){return parts.filter(p=>p.type==='booster').length}function say(s){logs.unshift(s);logs=logs.slice(0,8);$('#logs').innerHTML=logs.join('<br>')}function toast(s){$('#sub').textContent=s;setTimeout(()=>{if($('#sub').textContent===s)$('#sub').textContent=mode==='build'?'选择部件组装火箭':'监控高度与燃料'},1800)}function add(type){if(mode!=='build')return toast('请先返回建造模式');if(parts.length>=14)return toast('部件最多14个');let d=D[type];parts.push({type,name:d[0],m:d[1],f:d[2],color:d[3],h:d[4]});sel=parts.length-1;ui();draw();say('已安装：'+d[0])}document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>add(b.dataset.p));function remove(){if(sel<0||!parts[sel])return toast('请先选中部件');say('已拆除：'+parts[sel].name);parts.splice(sel,1);sel=-1;ui();draw()}function launch(){if(mode==='flight'){f.thrust=!f.thrust;return}if(!parts.some(p=>p.type==='capsule'))return toast('请先安装指令舱');if(!eng()&&!boo())return toast('请安装发动机或助推器');mode='flight';f={x:0,y:0,vx:0,vy:0,a:0,fuel:Math.max(5,cap()),t:0,thrust:false,crash:false,orbit:false,stage:0};$('#launch').textContent='⏯ 点火/暂停';$('#title').textContent='飞行控制中心';$('#tip').textContent='← → 转向 · ↑ 推进 · Enter 分离级段';say('发射成功');ui()}function build(){mode='build';f.thrust=false;$('#launch').textContent='▲ 发射';$('#title').textContent='火箭装配中心';$('#tip').textContent='点击左侧添加部件 · 拖动调整顺序';ui();draw()}function separate(){if(mode!=='flight'||parts.length<2)return toast('当前没有可分离级段');let n=Math.max(1,Math.floor(parts.length/2));parts.splice(0,n);f.stage++;f.thrust=false;f.vy+=5;say('级段分离，移除 '+n+' 个部件');ui()}function reset(){parts=[];sel=-1;mode='build';f={x:0,y:0,vx:0,vy:0,a:0,fuel:100,t:0,thrust:false,crash:false,orbit:false,stage:0};say('任务重置');build()}$('#launch').onclick=launch;$('#build').onclick=build;$('#throttle').onclick=()=>{if(mode==='flight')f.thrust=!f.thrust;else toast('先发射火箭')};$('#stage').onclick=separate;$('#remove').onclick=remove;$('#reset').onclick=reset;$('#orbit').onclick=()=>{f.orbit=!f.orbit;draw()};$('#save').onclick=()=>{try{localStorage.setItem('sf2',JSON.stringify(parts.map(p=>p.type)));toast('设计已保存')}catch(e){toast('保存失败')}};$('#load').onclick=()=>{try{let a=JSON.parse(localStorage.getItem('sf2')||'null');if(!Array.isArray(a))return toast('没有存档');parts=a.filter(t=>D[t]).slice(0,14).map(t=>{let d=D[t];return{type:t,name:d[0],m:d[1],f:d[2],color:d[3],h:d[4]}});sel=-1;build();say('已读取设计')}catch(e){toast('读取失败')}};function turn(v){keys.turn=v}for(let [id,v] of [['left',-1],['right',1]]){$('#'+id).onpointerdown=e=>{e.preventDefault();turn(v)};$('#'+id).onpointerup=$('#'+id).onpointercancel=()=>turn(0)}$('#push').onpointerdown=e=>{e.preventDefault();if(mode==='flight')f.thrust=true};$('#push').onpointerup=$('#push').onpointercancel=()=>f.thrust=false;$('#cut').onclick=()=>f.thrust=false;window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key===' '&&!e.repeat&&mode==='flight')f.thrust=!f.thrust;if(e.key==='Enter')separate();if(e.key.toLowerCase()==='x')f.thrust=false});window.addEventListener('keyup',e=>keys[e.key]=false);function resize(){let r=cv.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=Math.max(1,W*dpr);cv.height=Math.max(1,H*dpr);c.setTransform(dpr,0,0,dpr,0,0);draw()}new ResizeObserver(resize).observe(cv);function pos(){let y=H*.78+parts.reduce((s,p)=>s+p.h+4,0)*.35;return parts.map(p=>{y-=p.h;let q={x:W/2,y};y-=4;return q})}function hit(x,y){let a=pos();for(let i=parts.length-1;i>=0;i--)if(Math.abs(x-a[i].x)<40&&Math.abs(y-a[i].y)<parts[i].h/2+5)return i;return -1}cv.addEventListener('pointerdown',e=>{if(mode!=='build')return;let r=cv.getBoundingClientRect(),i=hit(e.clientX-r.left,e.clientY-r.top);if(i>=0){drag=i;sel=i;dragY=e.clientY;cv.setPointerCapture(e.pointerId);draw()}});cv.addEventListener('pointermove',e=>{if(drag<0)return;let y=e.clientY-cv.getBoundingClientRect().top;if(Math.abs(y-dragY)<10)return;let n=Math.max(0,Math.min(parts.length-1,Math.floor((H*.78-y)/29)));if(n!==drag){let p=parts.splice(drag,1)[0];parts.splice(n,0,p);drag=n;sel=n;draw();ui()}});cv.addEventListener('pointerup',()=>{if(drag>=0)say('部件顺序已调整');drag=-1});function ui(){let m=mass(),fuel=mode==='flight'?f.fuel:100;$('#mass').textContent=m.toFixed(1)+' t';$('#fn').textContent=Math.round(fuel)+'%';$('#fuel').textContent='燃料 '+Math.round(fuel)+'%';$('#bar').style.width=Math.max(0,Math.min(100,fuel))+'%';$('#twr').textContent=(eng()*18+boo()*24)/(m||1);$('#mission').textContent=mode==='build'?'建造中':f.crash?'任务结束':f.orbit?'轨道观测':f.thrust?'动力飞行':'滑行';$('#alt').textContent='高度 '+Math.max(0,f.y/1000).toFixed(1)+' km';$('#vel').textContent='速度 '+Math.round(Math.hypot(f.vx,f.vy))+' m/s';$('#clock').textContent='T+'+String(Math.floor(f.t/60)).padStart(2,'0')+':'+String(Math.floor(f.t%60)).padStart(2,'0')}function stars(){c.fillStyle='#030914';c.fillRect(0,0,W,H);let seed=13;for(let i=0;i<110;i++){seed=(seed*9301+49297)%233280;let x=seed/233280*W;seed=(seed*9301+49297)%233280;let y=seed/233280*H;c.globalAlpha=.3+(i%4)*.15;c.fillStyle=i%9?'#b5cbe1':'#72dfff';c.fillRect(x,y,i%12===0?2:1,i%12===0?2:1)}c.globalAlpha=1}function rocket(x,y,scale){c.save();c.translate(x,y);c.rotate(f.a);c.scale(scale,scale);let yy=0;parts.forEach((p,i)=>{c.save();c.translate(0,yy-p.h/2);c.fillStyle=p.color;c.strokeStyle=sel===i&&mode==='build'?'#66e4ff':'#edf6ff';c.lineWidth=sel===i?2:1;if(p.type==='capsule'){c.beginPath();c.moveTo(-12,9);c.lineTo(0,-15);c.lineTo(12,9);c.closePath();c.fill();c.stroke()}else if(p.type==='tank'||p.type==='booster'){c.fillRect(-12,-p.h/2,24,p.h);c.strokeRect(-12,-p.h/2,24,p.h)}else if(p.type==='engine'){c.fillRect(-12,-8,24,14);if(f.thrust){c.fillStyle='#ffb24f';c.beginPath();c.moveTo(-7,6);c.lineTo(0,24+Math.random()*6);c.lineTo(7,6);c.fill()}}else if(p.type==='solar'){c.fillRect(-34,-6,20,12);c.fillRect(14,-6,20,12)}else{c.beginPath();c.moveTo(-9,-3);c.lineTo(-25,10);c.lineTo(-30,10);c.moveTo(9,-3);c.lineTo(25,10);c.lineTo(30,10);c.stroke()}c.restore();yy-=p.h});c.restore()}function draw(){if(!W||!H)return;stars();if(mode==='build'){c.fillStyle='#0a2032';c.fillRect(0,H*.79,W,H*.21);c.strokeStyle='#2b4c65';c.beginPath();c.moveTo(0,H*.79);c.lineTo(W,H*.79);c.stroke();if(parts.length)rocket(W/2,H*.78,1);else{c.strokeStyle='#2b4b63';c.setLineDash([5,5]);c.strokeRect(W/2-40,H*.79-125,80,125);c.setLineDash([]);c.fillStyle='#7896af';c.textAlign='center';c.font='12px system-ui';c.fillText('从左侧添加部件',W/2,H*.79-60);c.textAlign='left'}}else if(f.orbit){c.save();c.translate(W/2,H/2);c.strokeStyle='#315675';[45,82,125,165].forEach(r=>{c.beginPath();c.ellipse(0,0,r,r*.63,0,0,Math.PI*2);c.stroke()});c.fillStyle='#2472ad';c.beginPath();c.arc(0,0,25,0,Math.PI*2);c.fill();c.fillStyle='#9de8ff';c.beginPath();c.arc(Math.cos(f.t*.28)*125,Math.sin(f.t*.28)*79,5,0,Math.PI*2);c.fill();c.restore()}else{let gy=H*.82-Math.min(f.y*.018,H*.58);c.fillStyle=f.y>5000?'#07101e':'#102c43';c.fillRect(0,gy,W,H-gy);c.fillStyle='#1b4a69';c.beginPath();c.ellipse(W/2,gy,W*.44,23,0,Math.PI,Math.PI*2);c.fill();rocket(W/2+Math.max(-W*.3,Math.min(W*.3,f.x*.02)),gy-32,Math.max(.5,1-f.y/160000));if(f.crash){c.fillStyle='#ff8d69';c.textAlign='center';c.fillText('任务结束 · 请重置',W/2,H*.45);c.textAlign='left'}}ui()}function frame(ts){let dt=Math.min((ts-last)/1000||0,.035);last=ts;if(mode==='flight'&&!f.crash){f.t+=dt;f.a+=((keys.ArrowLeft||keys.a?-1:0)+(keys.ArrowRight||keys.d?1:0)+(keys.turn||0))*dt*.85;if(keys.ArrowUp||keys.w)f.thrust=true;if(f.thrust&&f.fuel>0){let p=eng()*18+boo()*24,m=Math.max(1,mass());f.vx+=Math.sin(f.a)*p/m*dt*16;f.vy+=Math.cos(f.a)*p/m*dt*16;f.fuel=Math.max(0,f.fuel-dt*(boo()?1.8:1.1))}else if(f.fuel<=0)f.thrust=false;f.vy-=9.8*dt*3.5;f.x+=f.vx*dt;f.y+=f.vy*dt*7;if(f.y<=0&&f.t>.5){f.y=0;if(Math.abs(f.vy)>24){f.crash=true;f.thrust=false;say('着陆冲击过大，任务结束')}else{f.vy=0;f.vx*=.9;f.thrust=false}}if(f.y>100000&&Math.hypot(f.vx,f.vy)>180)f.orbit=true}draw();requestAnimationFrame(frame)}say('星际工坊已就绪');resize();requestAnimationFrame(frame)})();
</script></body></html>
